[project]
name = "parakeet-stt-server"
version = "0.1.0"
description = "OpenAI-compatible Parakeet speech-to-text server for bb and other clients"
requires-python = ">=3.11,<3.14"
dependencies = [
    "aiohttp>=3.9.0",
    "av>=14.0",
    "numpy>=1.24.0",
    "onnx-asr[hub]==0.12.0",
]

[dependency-groups]
cpu = ["onnxruntime>=1.20,!=1.24.1,!=1.25.*,!=1.26.0"]

[tool.uv]
default-groups = ["cpu"]
